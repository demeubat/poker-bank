<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d6a48">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Покер">
<title>Покерный банк</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: table-side tool. Tabs (Стол / Рейтинг / История) on top; on desktop players left, settlement right; one column on phone. */
:root {
  --bg: #e9eeea; --surface: #ffffff; --surface-2: #f4f7f5; --ink: #15201b; --muted: #5a6a62; --line: #d3dcd6;
  --felt: #1d6a48; --felt-ink: #ffffff; --gain: #1c7a44; --loss: #b4352c; --warn: #9a6200; --warn-bg: #fff3d9;
  --chip-b: #ffffff;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0e1612; --surface: #15201a; --surface-2: #1b2821; --ink: #e4ede8; --muted: #8ea097; --line: #283a31;
  --felt: #3daa78; --felt-ink: #08130d; --gain: #52c487; --loss: #f0695d; --warn: #e3a840; --warn-bg: #2d2412;
  --chip-b: #15201a; color-scheme: dark;
} }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { overflow-x: hidden; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 56px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.3rem; } h2 { font-size: 0.95rem; } h3 { font-size: .85rem; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }

/* 16px on every field: smaller text makes iPhone zoom in on focus and the page starts sliding sideways */
button, input, select, textarea { font: inherit; color: inherit; font-size: 16px; }
button { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; min-height: 44px; touch-action: manipulation; }
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--felt); outline-offset: 2px; }
button.primary { background: var(--felt); color: var(--felt-ink); border-color: var(--felt); font-weight: 600; }
button.danger { background: var(--loss); border-color: var(--loss); color: #fff; font-weight: 600; }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.ghost:hover { color: var(--ink); border-color: var(--line); }
button:disabled { opacity: .4; cursor: default; }
input[type="text"], select, textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 44px; width: 100%; min-width: 0; }
textarea { resize: vertical; font-family: var(--f-num); }
input::placeholder { color: var(--muted); opacity: .7; }

.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.tabs button { flex: 1; border: 0; background: transparent; font-weight: 600; color: var(--muted); min-width: 0; padding-inline: 6px; }
.tabs button[aria-current="page"] { background: var(--felt); color: var(--felt-ink); }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.top .title { display: grid; gap: 2px; min-width: 0; }
.top .title h1 { overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.banner { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; background: var(--warn-bg); border: 1px dashed var(--warn); border-radius: var(--r); padding: 12px 14px; }
.banner > span { min-width: 0; flex: 1 1 220px; }

.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.strip > div { padding: 12px 14px; display: grid; gap: 2px; border-left: 1px solid var(--line); min-width: 0; align-content: start; }
.strip > div:first-child { border-left: 0; }
.strip .big { font-family: var(--f-num); font-size: 1.2rem; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; width: fit-content; max-width: 100%; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.pill.ok { color: var(--gain); background: color-mix(in srgb, var(--gain) 12%, transparent); }
.pill.bad { color: var(--loss); background: color-mix(in srgb, var(--loss) 12%, transparent); }
.pill.wait { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }

.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

.players { display: grid; gap: 10px; }
.player { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; background: var(--surface-2); }
.player.done { border-color: color-mix(in srgb, var(--felt) 50%, var(--line)); }
.p-head { display: flex; gap: 6px; align-items: center; }
.p-name { font-weight: 600; background: transparent !important; border-color: transparent !important; padding-left: 4px !important; flex: 1; }
.p-name:hover, .p-name:focus { border-color: var(--line) !important; }
.p-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.stack { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { width: 22px; height: 22px; border-radius: 50%; background: var(--felt); border: 3px dashed var(--chip-b); box-shadow: 0 0 0 1px var(--felt); }
.chip.custom { background: var(--warn); box-shadow: 0 0 0 1px var(--warn); }
.p-actions { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
.p-actions .rebuy { font-family: var(--f-num); font-weight: 600; }
.p-actions button { padding-inline: 6px; }
.custom-row { display: flex; gap: 6px; }
.p-out { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; padding-top: 10px; border-top: 1px dashed var(--line); }
.p-out label { display: grid; gap: 4px; min-width: 0; }
.p-out .zero { min-width: 56px; }
.net-line { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.net { font-family: var(--f-num); font-weight: 600; font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.gain { color: var(--gain); } .loss { color: var(--loss); }

.confirm { display: grid; gap: 8px; padding: 10px 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--loss) 45%, var(--line)); background: color-mix(in srgb, var(--loss) 7%, var(--surface)); font-size: .9rem; }
.confirm .actions button { flex: 1; }

.add-row { display: flex; gap: 8px; }
.add-row button { flex: none; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; max-width: 100%; }
.seg button { border: 0; border-radius: 0; min-height: 38px; background: transparent; padding-inline: 10px; }
.seg button[aria-pressed="true"] { background: var(--felt); color: var(--felt-ink); font-weight: 600; }

.results { list-style: none; margin: 0; padding: 0; display: grid; }
.results li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.results li:last-child { border-bottom: 0; }
.results .nm { font-weight: 600; overflow-wrap: anywhere; }
.results .sub { grid-column: 1 / -1; font-size: .82rem; color: var(--muted); font-family: var(--f-num); }

.transfers { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.transfers li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.transfers .who { min-width: 0; overflow-wrap: anywhere; }
.transfers .arrow { color: var(--muted); padding-inline: 6px; }
.transfers .amt { font-family: var(--f-num); font-weight: 600; white-space: nowrap; }
.note { font-size: .88rem; padding: 10px 12px; border-radius: 8px; background: var(--warn-bg); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.empty { font-size: .92rem; color: var(--muted); padding: 6px 0; margin: 0; }

details > summary { cursor: pointer; font-family: var(--f-display); font-weight: 700; font-size: .95rem; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: "+"; color: var(--muted); font-family: var(--f-num); }
details[open] > summary::after { content: "–"; }
.log { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 4px; max-height: 280px; overflow-y: auto; font-size: .88rem; }
.log li { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 8px; }

/* setup form */
.form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.form label { display: grid; gap: 4px; min-width: 0; }
.counter { display: flex; gap: 6px; align-items: center; }
.counter input { width: 72px; text-align: center; font-family: var(--f-num); font-weight: 600; }
.counter button { width: 48px; font-size: 1.2rem; font-weight: 600; }
.names { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.names label { grid-template-columns: 26px minmax(0, 1fr); align-items: center; gap: 6px; }
.names .n { font-family: var(--f-num); color: var(--muted); text-align: right; font-size: .85rem; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; }
.suggest button { min-height: 38px; border-radius: 999px; padding: 6px 14px; background: var(--surface-2); }
.suggest button[aria-pressed="true"] { background: var(--felt); color: var(--felt-ink); border-color: var(--felt); }
.check { display: flex !important; gap: 10px; align-items: center; }
.check input { width: 20px; height: 20px; flex: none; }

/* stats */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; align-content: start; }
.tile .big { font-family: var(--f-num); font-weight: 600; font-size: 1.15rem; overflow-wrap: anywhere; }
.rank { list-style: none; margin: 0; padding: 0; display: grid; }
.rank > li { border-bottom: 1px solid var(--line); }
.rank > li:last-child { border-bottom: 0; }
.rank-row { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; text-align: left; border: 0; background: transparent; border-radius: 0; padding: 10px 2px; }
.rank-row:hover { background: var(--surface-2); }
.rank-row .pos { font-family: var(--f-display); font-weight: 700; color: var(--muted); text-align: center; }
.rank-row .pos.top { color: var(--felt); }
.rank-row .nm { font-weight: 600; overflow-wrap: anywhere; }
.rank-row .val { font-family: var(--f-num); font-weight: 600; text-align: right; white-space: nowrap; }
.rank-row .sub { grid-column: 2 / -1; font-size: .8rem; color: var(--muted); }
.pdetail { padding: 4px 2px 14px 40px; display: grid; gap: 10px; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; }
.kv div { display: grid; gap: 1px; min-width: 0; }
.kv b { font-family: var(--f-num); font-weight: 600; font-size: .92rem; overflow-wrap: anywhere; }
.bars { display: flex; gap: 3px; height: 48px; align-items: stretch; }
.bars .b { flex: 1; position: relative; max-width: 22px; }
.bars .b::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--line); }
.bars .b i { position: absolute; left: 0; right: 0; border-radius: 2px; }
.bars .b i.up { bottom: 50%; background: var(--gain); }
.bars .b i.down { top: 50%; background: var(--loss); }

.hist { display: grid; gap: 8px; }
.hist-item { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.hist-item > summary { padding: 12px 14px; font-family: var(--f-body); font-size: .95rem; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; }
.hist-item > summary::after { display: none; }
.hist-item .h-title { font-weight: 600; overflow-wrap: anywhere; }
.hist-item .h-sub { grid-column: 1 / -1; font-size: .82rem; color: var(--muted); font-weight: 400; }
.hist-body { padding: 0 14px 14px; display: grid; gap: 12px; }

.toast { position: fixed; left: 16px; right: 16px; top: calc(10px + env(safe-area-inset-top, 0px)); pointer-events: none; box-shadow: 0 6px 20px rgb(0 0 0 / .25); margin: 0 auto; max-width: 420px; background: var(--ink); color: var(--bg); padding: 8px 8px 8px 16px; border-radius: 10px; font-weight: 500; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; }
.toast button { pointer-events: auto; background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); min-height: 36px; font-weight: 600; flex: none; }

@media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) {
  h1 { font-size: 1.1rem; }
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .strip > div:nth-child(3) { border-left: 0; }
  .strip > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .grid3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .grid3 > :first-child { grid-column: 1 / -1; }
  .names { grid-template-columns: minmax(0, 1fr); }
  .kv { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pdetail { padding-left: 2px; }
  .panel { padding: 14px 12px; }
  .add-row { flex-wrap: wrap; } .add-row button { flex: 1; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<datalist id="known-names"></datalist>
<div class="toast" id="toast" role="status" hidden><span id="toast-text"></span><button id="toast-btn" hidden>Отменить</button></div>

<script>
(function () {
  "use strict";
  const KEY = "poker-bank-v1";
  const MAX_PLAYERS = 20;
  const AUTO_NAME = /^игрок\s*\d+$/i;
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const uid = () => Math.random().toString(36).slice(2, 9);
  const now = () => Date.now();
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const toC = x => Math.round(x * 100);
  const parseNum = v => { const n = parseFloat(String(v).replace(/\s/g, "").replace(",", ".")); return isFinite(n) ? n : null; };
  const hhmm = t => new Date(t).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  const ddmm = t => new Date(t).toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });
  const ddmmyy = t => new Date(t).toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "2-digit" });
  const keyOf = name => name.trim().toLowerCase().replace(/ё/g, "е");
  const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; };

  function exampleGame() {
    const t0 = now() - 3.5 * 3600e3;
    const mk = (name, buys, cash) => ({ id: uid(), name, buys: buys.map((a, i) => ({ amt: a, t: t0 + i * 3000e3 })), cash });
    return {
      id: uid(), title: "Пример: пятничная игра", started: t0, currency: "₽", defaultBuyIn: 5000, chipRate: 1,
      example: true, mode: "direct", bankerId: null,
      players: [mk("Аня", [5000], 14200), mk("Борис", [5000, 5000, 5000], 3800), mk("Вика", [5000, 5000], 12500), mk("Гоша", [5000], 0), mk("Дима", [5000, 5000], 14500)],
      log: [{ t: t0, text: "Пример игры: 5 игроков, бай-ин 5 000 ₽" }]
    };
  }

  // ---------- state ----------
  let state = null;
  try { state = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { state = null; }
  if (!state || (!state.game && !state.setup && !(state.history || []).length)) state = { game: exampleGame(), history: [], setup: false };
  state.history = state.history || [];
  state.view = state.view || "table";
  state.rankBy = state.rankBy || "net";
  // clean up auto-generated names that older versions saved
  if (state.lastPlayers) state.lastPlayers = state.lastPlayers.filter(n => !AUTO_NAME.test(n));

  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  const g = () => state.game;
  function log(text) { if (g()) g().log.unshift({ t: now(), text }); }

  function money(x, sign, currency) {
    const c = currency || (g() && g().currency) || lastCurrency();
    const s = (Math.round(Math.abs(x) * 100) / 100).toLocaleString("ru-RU", { maximumFractionDigits: 2 });
    const p = sign ? (x > 0.004 ? "+" : x < -0.004 ? "−" : "") : (x < -0.004 ? "−" : "");
    return p + s + " " + c;
  }
  const fmt = (x, sign) => money(x, sign);
  function lastCurrency() { const h = state.history.find(h => h.game); return (h && h.game.currency) || "₽"; }
  const cls = n => n == null ? "muted" : n > 0.004 ? "gain" : n < -0.004 ? "loss" : "muted";

  const sumBuys = p => p.buys.reduce((a, b) => a + b.amt, 0);
  const cashMoney = (p, game = g()) => p.cash == null ? null : p.cash * (game.chipRate || 1);
  const net = (p, game = g()) => p.cash == null ? null : cashMoney(p, game) - sumBuys(p);

  // ---------- settlement ----------
  function settle(game) {
    const ps = game.players.filter(p => p.buys.length || p.cash != null);
    const missing = ps.filter(p => p.cash == null);
    const nets = ps.map(p => ({ p, c: p.cash == null ? 0 : toC(cashMoney(p, game) - sumBuys(p)) }));
    const diff = nets.reduce((a, n) => a + n.c, 0);
    const transfers = [];
    const banker = game.mode === "bank" && ps.find(p => p.id === game.bankerId);
    if (banker) {
      nets.forEach(n => {
        if (n.p === banker || n.c === 0) return;
        transfers.push(n.c < 0 ? { from: n.p, to: banker, c: -n.c } : { from: banker, to: n.p, c: n.c });
      });
    } else {
      const debt = nets.filter(n => n.c < 0).map(n => ({ p: n.p, c: -n.c })).sort((a, b) => b.c - a.c);
      const cred = nets.filter(n => n.c > 0).map(n => ({ p: n.p, c: n.c })).sort((a, b) => b.c - a.c);
      let i = 0, j = 0;
      while (i < debt.length && j < cred.length) {
        const c = Math.min(debt[i].c, cred[j].c);
        if (c > 0) transfers.push({ from: debt[i].p, to: cred[j].p, c });
        debt[i].c -= c; cred[j].c -= c;
        if (!debt[i].c) i++;
        if (!cred[j].c) j++;
      }
    }
    return { ps, missing, diff, transfers };
  }

  function summaryText(game) {
    const s = settle(game), m = (x, sg) => money(x, sg, game.currency);
    const bank = game.players.reduce((a, p) => a + sumBuys(p), 0);
    const lines = [`${game.title} · ${ddmm(game.started)}`, `Банк: ${m(bank)}`, "", "Итоги:"];
    s.ps.slice().sort((a, b) => (net(b, game) ?? -1e15) - (net(a, game) ?? -1e15)).forEach(p => {
      const n = net(p, game);
      lines.push(`${p.name}: ${n == null ? "стек не указан" : m(n, true)} (внёс ${m(sumBuys(p))})`);
    });
    lines.push("", "Переводы:");
    if (!s.transfers.length) lines.push("никто никому не должен");
    s.transfers.forEach(t => lines.push(`${t.from.name} → ${t.to.name}: ${m(t.c / 100)}`));
    if (s.diff) lines.push("", `Внимание: стеки не сходятся с банком на ${m(s.diff / 100, true)}`);
    return lines.join("\n");
  }

  // ---------- known names and stats ----------
  function finishedGames() { return state.history.filter(h => h.game).map(h => h.game); }

  function knownNames() {
    const map = new Map();
    const add = (name, t, w) => {
      if (!name || AUTO_NAME.test(name.trim())) return;
      const k = keyOf(name), e = map.get(k) || { name: name.trim(), n: 0, t: 0 };
      e.n += w; if (t >= e.t) { e.t = t; e.name = name.trim(); }
      map.set(k, e);
    };
    finishedGames().forEach(gm => gm.players.forEach(p => add(p.name, gm.started, 1)));
    (state.lastPlayers || []).forEach(n => add(n, 0, 0));
    if (g() && !g().example) g().players.forEach(p => add(p.name, g().started, 0));
    return [...map.values()].sort((a, b) => b.n - a.n || b.t - a.t).map(e => e.name);
  }
  function refreshDatalist() { $("#known-names").innerHTML = knownNames().map(n => `<option value="${esc(n)}"></option>`).join(""); }

  function computeStats() {
    const games = finishedGames().slice().sort((a, b) => a.started - b.started);
    const players = new Map();
    let turnover = 0, biggest = null, bigPot = null;
    games.forEach(gm => {
      let pot = 0;
      gm.players.forEach(p => {
        if (!p.buys.length && p.cash == null) return;
        const k = keyOf(p.name);
        const s = players.get(k) || { name: p.name, games: 0, wins: 0, losses: 0, net: 0, buy: 0, entries: 0, best: -Infinity, worst: Infinity, results: [], last: 0 };
        const n = p.cash == null ? -sumBuys(p) : net(p, gm);
        s.name = p.name; s.games++; s.net += n; s.buy += sumBuys(p); s.entries += p.buys.length;
        if (n > 0.004) s.wins++; else if (n < -0.004) s.losses++;
        s.best = Math.max(s.best, n); s.worst = Math.min(s.worst, n);
        s.results.push({ t: gm.started, n }); s.last = gm.started;
        players.set(k, s);
        pot += sumBuys(p);
        if (!biggest || n > biggest.n) biggest = { name: p.name, n, t: gm.started };
      });
      turnover += pot;
      if (!bigPot || pot > bigPot.pot) bigPot = { pot, t: gm.started, title: gm.title };
    });
    const list = [...players.values()];
    list.forEach(s => { s.avg = s.net / s.games; s.rate = s.wins / s.games; s.rebuys = (s.entries - s.games) / s.games; });
    return { games, list, turnover, biggest, bigPot };
  }

  // ---------- UI helpers ----------
  let toastTimer;
  function toast(msg, undo) {
    $("#toast-text").textContent = msg;
    const b = $("#toast-btn");
    b.hidden = !undo; b.onclick = undo ? () => { undo(); $("#toast").hidden = true; } : null;
    $("#toast").hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => $("#toast").hidden = true, undo ? 5000 : 2200);
  }

  async function copy(text, fallbackEl) {
    try { await navigator.clipboard.writeText(text); toast("Скопировано, можно вставлять в чат"); }
    catch (e) {
      if (fallbackEl) { fallbackEl.hidden = false; fallbackEl.value = text; fallbackEl.focus(); fallbackEl.select(); }
      toast("Текст выделен, скопируйте его вручную");
    }
  }

  // keep the phone screen on during a game
  let wakeLock = null;
  async function keepAwake() {
    if (wakeLock || !g() || g().example || !("wakeLock" in navigator) || document.visibilityState !== "visible") return;
    try { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); } catch (e) {}
  }
  document.addEventListener("visibilitychange", keepAwake);

  // replace markup only when it changed, so a tap in progress never loses its button
  function setHTML(el, html) { if (el && el.__html !== html) { el.innerHTML = html; el.__html = html; } }

  // ---------- render ----------
  function render() {
    refreshDatalist();
    const app = $("#app");
    const tabs = `<nav class="tabs" aria-label="Разделы">
      <button data-act="view" data-view="table" ${state.view === "table" ? 'aria-current="page"' : ""}>Стол</button>
      <button data-act="view" data-view="stats" ${state.view === "stats" ? 'aria-current="page"' : ""}>Рейтинг</button>
      <button data-act="view" data-view="history" ${state.view === "history" ? 'aria-current="page"' : ""}>История</button></nav>`;
    let body;
    if (state.view === "stats") body = statsView();
    else if (state.view === "history") body = historyView();
    else if (state.setup || !g()) body = setupView();
    else body = tableView();
    app.innerHTML = tabs + body;
    if (state.view === "table" && !state.setup && g()) renderDerived();
    if (state.view === "table" && (state.setup || !g())) syncSuggest();
  }

      <div class="top">
        <div class="title"><span class="label">Кэш · Hold’em · с ${hhmm(game.started)}, ${ddmm(game.started)}</span><h1>${esc(game.title)}</h1></div>

      </div>
      <div class="panel" id="settings" hidden>
        <div class="form"><div class="grid3">
          <label><span class="label">Название игры</span><input type="text" id="set-title" value="${esc(game.title)}"></label>
          <label><span class="label">Бай-ин</span><input type="text" inputmode="decimal" id="set-buyin" value="${game.defaultBuyIn}"></label>

          <div class="panel-head"><h2>Игроки</h2><span class="muted small">Фишка — один заход</span></div>

          <form class="add-row" id="add-form"><input type="text" id="add-name" list="known-names" placeholder="Имя нового игрока" autocomplete="off" enterkeyhint="done"><button class="primary" type="submit">Посадить</button></form>

  function playerView(p) {
    const game = g();
    const chips = p.buys.map(b => `<span class="chip${b.amt !== game.defaultBuyIn ? " custom" : ""}" title="${money(b.amt)} · ${hhmm(b.t)}"></span>`).join("");
    const what = p.buys.length === 0 ? "ещё не заходил" : p.buys.length === 1 ? "бай-ин" : `бай-ин + ${p.buys.length - 1} ${plural(p.buys.length - 1, "ребай", "ребая", "ребаев")}`;
    return `<div class="player${p.cash != null ? " done" : ""}" data-id="${p.id}">
      <div class="p-head"><input type="text" class="p-name" id="name-${p.id}" value="${esc(p.name)}" list="known-names" aria-label="Имя игрока" autocomplete="off"><button class="ghost" data-act="del">Убрать</button></div>
      <div class="confirm" data-confirm="del" hidden>
        <span>Убрать <b>${esc(p.name)}</b> из игры?${p.buys.length ? ` Его заходы на ${money(sumBuys(p))} пропадут из банка. Если игрок просто ушёл, лучше впишите его стек.` : ""}</span>
        <div class="actions"><button class="danger" data-act="del-yes">Убрать</button><button data-act="del-no">Оставить</button></div>
      </div>
      <div class="p-meta"><div class="stack">${chips}</div><span class="muted small">${what}${p.buys.length ? ` · <b class="num" style="color:var(--ink)">${money(sumBuys(p))}</b>` : ""}</span></div>
      <div class="p-actions">
        <button class="rebuy primary" data-act="buy">+ ${money(game.defaultBuyIn)}</button>
        <button data-act="undo" ${p.buys.length ? "" : "disabled"} title="Убрать последний заход">− заход</button>
        <button data-act="custom">Сумма…</button>
      </div>
      <form class="custom-row" data-form="custom" hidden><input type="text" inputmode="decimal" id="custom-${p.id}" placeholder="Сумма захода, ${esc(game.currency)}" enterkeyhint="done"><button class="primary" type="submit">Добавить</button></form>
      <div class="p-out">
        <label><span class="label">Стек на выходе${game.chipRate !== 1 ? ", фишек" : ""}</span><input type="text" inputmode="decimal" id="cash-${p.id}" data-cash value="${p.cash == null ? "" : p.cash}" placeholder="ещё играет" enterkeyhint="done"></label>
        <button class="zero" data-act="zero" title="Проиграл всё">0</button>
      </div>
      <div class="net-line"><span class="muted small" id="conv-${p.id}"></span><span class="net" id="net-${p.id}"></span></div>
    </div>`;
  }

  function renderDerived() {
    const game = g(); if (!game || !$("#strip")) return;
    const bank = game.players.reduce((a, p) => a + sumBuys(p), 0);
    const entries = game.players.reduce((a, p) => a + p.buys.length, 0);
    const rebuys = entries - game.players.filter(p => p.buys.length).length;
    const s = settle(game);
    const cashSum = s.ps.reduce((a, p) => a + (cashMoney(p) || 0), 0);
    let pill;
    if (!s.ps.length) pill = `<span class="pill wait">Нет заходов</span>`;
    else if (s.missing.length) pill = `<span class="pill wait">Идёт игра</span>`;
    else if (!s.diff) pill = `<span class="pill ok">Сходится</span>`;
    else pill = `<span class="pill bad">${fmt(s.diff / 100, true)}</span>`;
    setHTML($("#strip"), `
      <div><span class="label">Банк</span><span class="big">${fmt(bank)}</span></div>
      <div><span class="label">Ребаев</span><span class="big">${rebuys}</span></div>
      <div><span class="label">Стеки</span><span class="big">${s.ps.length - s.missing.length} из ${s.ps.length}</span></div>
      <div><span class="label">Баланс</span>${pill}</div>`);
    game.players.forEach(p => {
      const el = $("#net-" + p.id); if (!el) return;
      const n = net(p);
      el.textContent = n == null ? "" : fmt(n, true);
      el.className = "net " + cls(n);
      $("#conv-" + p.id).textContent = p.cash != null && game.chipRate !== 1 ? `${p.cash.toLocaleString("ru-RU")} × ${game.chipRate} = ${fmt(cashMoney(p))}` : "";
      el.closest(".player").classList.toggle("done", p.cash != null);
    });
    setHTML($("#settle"), settleView(game, s, cashSum));
    setHTML($("#log"), game.log.map(l => `<li><span class="muted num">${hhmm(l.t)}</span><span>${esc(l.text)}</span></li>`).join("") || `<li class="empty">Пока пусто</li>`);
  }

  function settleView(game, s, cashSum) {
    const head = `<div class="panel-head"><h2>Расчёт</h2>
      <div class="seg" role="group" aria-label="Способ расчёта"><button data-act="mode" data-mode="direct" aria-pressed="${game.mode !== "bank"}">Напрямую</button><button data-act="mode" data-mode="bank" aria-pressed="${game.mode === "bank"}">Через банкира</button></div></div>
      ${game.mode === "bank" ? `<label style="display:grid;gap:4px"><span class="label">Банкир — у кого деньги</span><select id="banker">${s.ps.map(p => `<option value="${p.id}" ${p.id === game.bankerId ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></label>` : ""}`;
    if (!s.ps.length) return head + `<p class="empty">Отметьте заходы игроков. Расчёт появится здесь.</p>`;
    const notes = [];
    if (s.missing.length) notes.push(`Ещё играют: ${s.missing.map(p => esc(p.name)).join(", ")}. Пока их стек считается нулём, расчёт предварительный.`);
    else if (s.diff) notes.push(`Стеки вместе ${s.diff > 0 ? "больше" : "меньше"} банка на <b class="num">${fmt(Math.abs(s.diff) / 100)}</b> (банк ${fmt(game.players.reduce((a, p) => a + sumBuys(p), 0))}, вынесли ${fmt(cashSum)}). Пересчитайте фишки или проверьте, все ли ребаи отмечены.`);
    const rows = s.ps.slice().sort((a, b) => (net(b) ?? -1e15) - (net(a) ?? -1e15)).map(p => {
      const n = net(p);
      return `<li><span class="nm">${esc(p.name)}</span><span class="net ${cls(n)}">${n == null ? "играет" : fmt(n, true)}</span>
        <span class="sub">внёс ${fmt(sumBuys(p))} · вынес ${p.cash == null ? "—" : fmt(cashMoney(p))}</span></li>`;
    }).join("");
    const transfers = s.transfers.length
      ? `<ul class="transfers">${s.transfers.map(t => `<li><span class="who"><b>${esc(t.from.name)}</b><span class="arrow">→</span><b>${esc(t.to.name)}</b></span><span class="amt">${fmt(t.c / 100)}</span></li>`).join("")}</ul>`
      : `<p class="empty">${s.missing.length === s.ps.length ? "Переводы появятся, когда игроки впишут стеки." : "Никто никому не должен."}</p>`;
    const issues = s.missing.length ? `Стек не введён у: ${s.missing.map(p => esc(p.name)).join(", ")}. Они попадут в статистику с нулём.` : s.diff ? `Стеки не сходятся с банком на ${fmt(s.diff / 100, true)}.` : "";
    return head + `
      ${notes.map(n => `<div class="note">${n}</div>`).join("")}
      <ul class="results">${rows}</ul>
      <div style="display:grid;gap:8px"><span class="label">Кто кому переводит</span>${transfers}
        <span class="muted small">${game.mode === "bank" ? "Все рассчитываются через банкира." : `Переводов: ${s.transfers.length}, это минимум. Проигравшие платят напрямую выигравшим.`}</span></div>
      <div class="actions"><button class="primary" data-act="copy" style="flex:1">Скопировать для чата</button>${game.example ? "" : `<button data-act="finish" style="flex:1">Завершить игру</button>`}</div>
      <div class="confirm" data-confirm="finish" hidden>
        <span>Сохранить игру в историю и рейтинг? ${issues}</span>
        <div class="actions"><button class="primary" data-act="finish-yes">Сохранить</button><button data-act="finish-no">Ещё не всё</button></div>
      </div>
      <textarea id="copy-fallback" rows="8" hidden readonly></textarea>`;
  }

  // ----- setup -----
  function setupView() {
    const prev = g() && !g().example ? g() : (finishedGames()[0] || {});
    const last = state.lastPlayers && state.lastPlayers.length ? state.lastPlayers : [];
    const count = Math.max(2, last.length || 6);
    return `
      <div class="top"><div class="title"><span class="label">Кэш · Texas Hold’em</span><h1>Новая игра</h1></div>
        ${g() ? `<div class="actions"><button data-act="cancel-setup">К текущей игре</button></div>` : ""}</div>
      <form class="panel form" id="setup-form" autocomplete="off">
        <div class="grid3">
          <label><span class="label">Название</span><input type="text" id="new-title" placeholder="Игра ${ddmm(now())}"></label>
          <label><span class="label">Бай-ин</span><input type="text" inputmode="decimal" id="new-buyin" value="${prev.defaultBuyIn || 5000}"></label>
          <label><span class="label">Валюта</span><input type="text" id="new-cur" value="${esc(prev.currency || "₽")}" maxlength="4"></label>
        </div>
        <div style="display:grid;gap:4px"><span class="label">Сколько игроков</span>
          <div class="counter"><button type="button" data-act="cnt" data-d="-1" aria-label="Меньше">−</button><input type="text" inputmode="numeric" id="new-count" value="${count}" aria-label="Количество игроков"><button type="button" data-act="cnt" data-d="1" aria-label="Больше">+</button></div></div>
        <div style="display:grid;gap:8px"><span class="label">Имена</span>
          ${knownNames().length ? `<div style="display:grid;gap:6px"><span class="muted small">Нажмите на имя, чтобы посадить игрока за стол:</span><div class="suggest" id="suggest">${knownNames().slice(0, 24).map(n => `<button type="button" data-act="pick" data-name="${esc(n)}" aria-pressed="false">${esc(n)}</button>`).join("")}</div>
          ${last.length ? `<div><button type="button" data-act="same" class="ghost" style="padding-inline:0">Посадить тех же, что в прошлый раз (${last.length})</button></div>` : ""}</div>` : ""}
          <div class="names" id="new-names">${nameFields(count, [])}</div>
          <span class="muted small">Пустые поля станут «Игрок 1», «Игрок 2»… Переименовать можно и во время игры.</span></div>
        <details><summary style="font-family:var(--f-body);font-size:.9rem;font-weight:600">Фишки и стеки</summary>
          <label style="margin-top:10px"><span class="label">Цена одной фишки</span><input type="text" inputmode="decimal" id="new-rate" value="${prev.chipRate || 1}"></label>
          <span class="muted small">Если стеки считаете в деньгах, оставьте 1.</span></details>
        <label class="check"><input type="checkbox" id="new-autobuy" checked> Сразу отметить всем первый бай-ин</label>
        ${g() && !g().example ? `<p class="note" style="margin:0">Текущая игра «${esc(g().title)}» сохранится в историю.</p>` : ""}
        <button class="primary" type="submit">Сесть за стол</button>
      </form>`;
  }

  function nameFields(n, names) {
    let h = "";
    for (let i = 0; i < n; i++) h += `<label><span class="n">${i + 1}</span><input type="text" id="new-name-${i}" data-name value="${esc(names[i] || "")}" placeholder="Игрок ${i + 1}" list="known-names" autocomplete="off" enterkeyhint="next"></label>`;
    return h;
  }
  const currentNames = () => $$("#new-names [data-name]").map(i => i.value);
  function setCount(n, names) {
    n = Math.max(1, Math.min(MAX_PLAYERS, n || 1));
    const cur = names || currentNames();
    if (names || cur.length !== n) $("#new-names").innerHTML = nameFields(n, cur);
    $("#new-count").value = n;
    syncSuggest();
    return n;
  }
  function syncSuggest() {
    const taken = new Set(currentNames().filter(Boolean).map(keyOf));
    $$("#suggest [data-name]").forEach(b => b.setAttribute("aria-pressed", taken.has(keyOf(b.dataset.name))));
  }
  function pickName(name) {
    const inputs = $$("#new-names [data-name]");
    const same = inputs.find(i => keyOf(i.value) === keyOf(name) && i.value.trim());
    if (same) { same.value = ""; syncSuggest(); return; }
    let empty = inputs.find(i => !i.value.trim());
    if (!empty) {
      if (inputs.length >= MAX_PLAYERS) { toast(`Не больше ${MAX_PLAYERS} игроков`); return; }
      setCount(inputs.length + 1);
      empty = $$("#new-names [data-name]").pop();
    }
    empty.value = name; syncSuggest();
  }

  // ----- stats -----
  function statsView() {
    const st = computeStats();
    if (!st.games.length) return `<div class="top"><div class="title"><span class="label">Все игры</span><h1>Рейтинг</h1></div></div>
      <section class="panel"><p class="empty">Рейтинг появится после первой завершённой игры. Сыграйте, нажмите «Завершить игру» в расчёте, и здесь будут итоги каждого игрока, процент плюсовых игр, лучшие и худшие вечера.</p></section>`;
    const by = state.rankBy;
    const metric = { net: s => s.net, avg: s => s.avg, rate: s => s.rate + s.games * 1e-6 }[by];
    const list = st.list.slice().sort((a, b) => metric(b) - metric(a) || b.games - a.games);
    const val = s => by === "rate" ? Math.round(s.rate * 100) + "%" : money(by === "avg" ? s.avg : s.net, true, lastCurrency());
    const valCls = s => by === "rate" ? "" : cls(by === "avg" ? s.avg : s.net);
    const m = (x, sg) => money(x, sg, lastCurrency());
    return `
      <div class="top"><div class="title"><span class="label">${st.games.length} ${plural(st.games.length, "игра", "игры", "игр")} · с ${ddmmyy(st.games[0].started)}</span><h1>Рейтинг</h1></div></div>
      <div class="tiles">
        <div class="tile"><span class="label">Игр</span><span class="big">${st.games.length}</span></div>
        <div class="tile"><span class="label">Оборот</span><span class="big">${m(st.turnover)}</span><span class="muted small">все заходы</span></div>
        <div class="tile"><span class="label">Крупнейший плюс</span><span class="big gain">${m(st.biggest.n, true)}</span><span class="muted small">${esc(st.biggest.name)}, ${ddmm(st.biggest.t)}</span></div>
        <div class="tile"><span class="label">Самый большой банк</span><span class="big">${m(st.bigPot.pot)}</span><span class="muted small">${ddmm(st.bigPot.t)}</span></div>
      </div>
      <section class="panel">
        <div class="panel-head"><h2>Игроки</h2>
          <div class="seg" role="group" aria-label="Сортировка"><button data-act="rank" data-by="net" aria-pressed="${by === "net"}">Итог</button><button data-act="rank" data-by="avg" aria-pressed="${by === "avg"}">За игру</button><button data-act="rank" data-by="rate" aria-pressed="${by === "rate"}">% плюс</button></div></div>
        <ol class="rank">${list.map((s, i) => `<li>
          <button class="rank-row" data-act="pstat" aria-expanded="false">
            <span class="pos${i < 3 ? " top" : ""}">${i + 1}</span><span class="nm">${esc(s.name)}</span><span class="val ${valCls(s)}">${val(s)}</span>
            <span class="sub">${s.games} ${plural(s.games, "игра", "игры", "игр")} · в плюсе ${Math.round(s.rate * 100)}% · ${by === "net" ? `за игру ${m(s.avg, true)}` : `всего ${m(s.net, true)}`}</span>
          </button>
          <div class="pdetail" hidden>
            <div class="kv">
              <div><span class="label">Итог</span><b class="${cls(s.net)}">${m(s.net, true)}</b></div>
              <div><span class="label">За игру</span><b class="${cls(s.avg)}">${m(s.avg, true)}</b></div>
              <div><span class="label">Плюс / минус</span><b>${s.wins} / ${s.losses}</b></div>
              <div><span class="label">Лучшая</span><b class="gain">${m(s.best, true)}</b></div>
              <div><span class="label">Худшая</span><b class="loss">${m(s.worst, true)}</b></div>
              <div><span class="label">Ребаев за игру</span><b>${s.rebuys.toLocaleString("ru-RU", { maximumFractionDigits: 1 })}</b></div>
              <div><span class="label">Всего внёс</span><b>${m(s.buy)}</b></div>
              <div><span class="label">Последняя игра</span><b>${ddmmyy(s.last)}</b></div>
            </div>
            <div style="display:grid;gap:4px"><span class="label">Последние ${Math.min(20, s.results.length)} игр</span>${bars(s.results.slice(-20))}</div>
          </div></li>`).join("")}</ol>
      </section>`;
  }
  function bars(rs) {
    const max = Math.max(...rs.map(r => Math.abs(r.n)), 1);
    return `<div class="bars">${rs.map(r => `<span class="b" title="${ddmm(r.t)}: ${money(r.n, true, lastCurrency())}"><i class="${r.n >= 0 ? "up" : "down"}" style="height:${Math.max(2, Math.abs(r.n) / max * 50)}%"></i></span>`).join("")}</div>`;
  }

  // ----- history -----
  function historyView() {
    const items = state.history.map((h, i) => {
      if (!h.game) return `<details class="hist-item"><summary><span class="h-title">${esc(h.title)}</span><span class="muted num small">${ddmmyy(h.started)}</span><span class="h-sub">старая запись, без статистики</span></summary>
        <div class="hist-body"><pre class="num small" style="margin:0;white-space:pre-wrap">${esc(h.text)}</pre>${histActions(i)}</div></details>`;
      const gm = h.game, s = settle(gm), m = (x, sg) => money(x, sg, gm.currency);
      const bank = gm.players.reduce((a, p) => a + sumBuys(p), 0);
      const sorted = s.ps.slice().sort((a, b) => (net(b, gm) ?? -1e15) - (net(a, gm) ?? -1e15));
      const top = sorted[0];
      return `<details class="hist-item"><summary><span class="h-title">${esc(gm.title)}</span><span class="muted num small">${ddmmyy(gm.started)}</span>
          <span class="h-sub">${s.ps.length} ${plural(s.ps.length, "игрок", "игрока", "игроков")} · банк ${m(bank)}${top && net(top, gm) > 0 ? ` · лучший ${esc(top.name)} ${m(net(top, gm), true)}` : ""}</span></summary>
        <div class="hist-body">
          <ul class="results">${sorted.map(p => { const n = net(p, gm); return `<li><span class="nm">${esc(p.name)}</span><span class="net ${cls(n)}">${n == null ? "—" : m(n, true)}</span><span class="sub">внёс ${m(sumBuys(p))} · заходов ${p.buys.length}</span></li>`; }).join("")}</ul>
          ${s.transfers.length ? `<ul class="transfers">${s.transfers.map(t => `<li><span class="who">${esc(t.from.name)}<span class="arrow">→</span>${esc(t.to.name)}</span><span class="amt">${m(t.c / 100)}</span></li>`).join("")}</ul>` : ""}
          ${histActions(i)}
        </div></details>`;
    }).join("");
    return `<div class="top"><div class="title"><span class="label">Завершённые игры</span><h1>История</h1></div></div>
      <div class="hist">${items || `<section class="panel"><p class="empty">Здесь появятся игры после «Завершить игру».</p></section>`}</div>
      <section class="panel"><details><summary>Резервная копия</summary>
        <div style="display:grid;gap:10px;margin-top:12px">
          <span class="muted small">Все игры хранятся только в этом браузере. Сохраните копию, чтобы перенести их на другой телефон или не потерять при очистке браузера.</span>
          <div class="actions"><button data-act="export">Скопировать копию</button><button data-act="export-file">Скачать файлом</button></div>
          <textarea id="backup" rows="5" placeholder="Чтобы восстановить, вставьте сюда скопированный текст копии"></textarea>
          <div class="actions"><button data-act="import">Восстановить из текста</button><label class="small muted" style="display:flex;align-items:center;gap:8px">или файл <input type="file" id="import-file" accept=".json,application/json,text/plain" style="font-size:14px;max-width:200px"></label></div>
        </div></details></section>`;
  }
  const histActions = i => `<div class="actions" data-hist="${i}"><button data-act="hcopy">Скопировать итог</button><button class="ghost" data-act="hdel">Удалить</button></div>
    <div class="confirm" data-confirm="hdel" hidden><span>Удалить игру из истории? Она пропадёт и из рейтинга.</span><div class="actions"><button class="danger" data-act="hdel-yes" data-i="${i}">Удалить</button><button data-act="hdel-no">Отмена</button></div></div>`;

  // ---------- actions ----------
  function findP(el) { const card = el.closest(".player"); return card && g().players.find(p => p.id === card.dataset.id); }
  function addBuy(p, amt) { p.buys.push({ amt, t: now() }); log(`${p.name}: ${p.buys.length === 1 ? "бай-ин" : "ребай"} ${fmt(amt)}`); }
  function replacePlayer(p) {
    const old = $(`.player[data-id="${p.id}"]`); if (!old) return;
    const tmp = document.createElement("div"); tmp.innerHTML = playerView(p);
    old.replaceWith(tmp.firstElementChild);
  }
  const showConfirm = (btn, name, on) => {
    const scope = btn.closest(".player, .panel, .hist-body") || document;
    const box = $(`[data-confirm="${name}"]`, scope); if (box) box.hidden = !on;
    return box;
  };

  function archive(game) {
    state.history.unshift({ id: game.id, title: game.title, started: game.started, ended: now(), text: summaryText(game), game: JSON.parse(JSON.stringify(game)) });
    state.lastPlayers = game.players.map(p => p.name).filter(n => !AUTO_NAME.test(n));
  }

  function backupJSON() { return JSON.stringify({ app: "poker-bank", v: 2, exported: now(), history: state.history, lastPlayers: state.lastPlayers || [] }); }
  function importBackup(text) {
    let data;
    try { data = JSON.parse(text); } catch (e) { toast("Это не похоже на копию: текст не читается"); return; }
    if (!data || !Array.isArray(data.history)) { toast("В тексте нет истории игр"); return; }
    const have = new Set(state.history.map(h => h.id || h.started + h.title));
    let added = 0;
    data.history.forEach(h => { const k = h.id || h.started + h.title; if (!have.has(k)) { state.history.push(h); have.add(k); added++; } });
    state.history.sort((a, b) => b.started - a.started);
    if (!state.lastPlayers?.length && data.lastPlayers) state.lastPlayers = data.lastPlayers;
    save(); render(); toast(added ? `Добавлено игр: ${added}` : "Все эти игры уже есть");
  }

  document.addEventListener("click", e => {
    const btn = e.target.closest("button[data-act]"); if (!btn) return;
    const act = btn.dataset.act, game = g();
    keepAwake();
    switch (act) {
      case "view": $("#toast").hidden = true; state.view = btn.dataset.view; save(); render(); window.scrollTo(0, 0); return;
      case "new": state.setup = true; state.view = "table"; save(); render(); window.scrollTo(0, 0); return;
      case "cancel-setup": state.setup = false; save(); render(); return;
      case "settings": $("#settings").hidden = !$("#settings").hidden; return;
      case "cnt": setCount((parseInt($("#new-count").value, 10) || 0) + +btn.dataset.d); return;
      case "pick": pickName(btn.dataset.name); return;
      case "same": setCount(state.lastPlayers.length, state.lastPlayers.slice()); return;
      case "copy": copy(summaryText(game), $("#copy-fallback")); return;
      case "mode":
        game.mode = btn.dataset.mode;
        if (game.mode === "bank" && !settle(game).ps.some(p => p.id === game.bankerId)) { const f = game.players.find(p => p.buys.length); game.bankerId = f && f.id; }
        save(); renderDerived(); return;
      case "finish": showConfirm(btn, "finish", true).scrollIntoView({ block: "nearest", behavior: "smooth" }); return;
      case "finish-no": showConfirm(btn, "finish", false); return;
      case "finish-yes":
        archive(game); state.game = null; state.setup = true; save(); render(); window.scrollTo(0, 0); toast("Игра сохранена в историю и рейтинг"); return;
      case "rank": state.rankBy = btn.dataset.by; save(); render(); return;
      case "pstat": { const d = btn.nextElementSibling; d.hidden = !d.hidden; btn.setAttribute("aria-expanded", !d.hidden); return; }
      case "hcopy": copy(state.history[+btn.closest("[data-hist]").dataset.hist].text); return;
      case "hdel": showConfirm(btn, "hdel", true); return;
      case "hdel-no": showConfirm(btn, "hdel", false); return;
      case "hdel-yes": state.history.splice(+btn.dataset.i, 1); save(); render(); toast("Игра удалена"); return;
      case "export": copy(backupJSON(), $("#backup")); return;
      case "export-file": {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([backupJSON()], { type: "application/json" }));
        a.download = `poker-bank-${new Date().toISOString().slice(0, 10)}.json`; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000); return;
      }
      case "import": importBackup($("#backup").value); return;
    }
    const p = findP(btn); if (!p) return;
    switch (act) {
      case "buy": {
        addBuy(p, game.defaultBuyIn); save(); replacePlayer(p); renderDerived();
        toast(`${p.name}: ${p.buys.length === 1 ? "бай-ин" : "ребай"} ${fmt(game.defaultBuyIn)}`, () => { const b = p.buys.pop(); if (b) log(`${p.name}: отменён заход ${fmt(b.amt)}`); save(); replacePlayer(p); renderDerived(); });
        return;
      }
      case "undo": {
        const b = p.buys.pop(); if (!b) return;
        log(`${p.name}: убран заход ${fmt(b.amt)}`); save(); replacePlayer(p); renderDerived();
        toast(`${p.name}: убран заход ${fmt(b.amt)}`, () => { p.buys.push(b); log(`${p.name}: заход ${fmt(b.amt)} возвращён`); save(); replacePlayer(p); renderDerived(); });
        return;
      }
      case "custom": { const f = $("[data-form=custom]", btn.closest(".player")); f.hidden = !f.hidden; if (!f.hidden) f.querySelector("input").focus(); return; }
      case "zero": p.cash = 0; log(`${p.name}: ушёл с нулём`); save(); $("#cash-" + p.id).value = "0"; renderDerived(); return;
      case "del": showConfirm(btn, "del", true); return;
      case "del-no": showConfirm(btn, "del", false); return;
      case "del-yes": {
        const idx = game.players.indexOf(p);
        game.players.splice(idx, 1);
        if (game.bankerId === p.id) game.bankerId = null;
        log(`${p.name} убран из игры`); save(); btn.closest(".player").remove(); renderDerived();
        toast(`${p.name} убран`, () => { game.players.splice(idx, 0, p); log(`${p.name} возвращён`); save(); render(); });
        return;
      }
    }
  });

  document.addEventListener("submit", e => {
    e.preventDefault();
    const f = e.target;
    if (f.id === "add-form") {
      const name = $("#add-name").value.trim(); if (!name) { $("#add-name").focus(); return; }
      if (g().players.some(p => keyOf(p.name) === keyOf(name))) { toast(`${name} уже за столом`); return; }
      const p = { id: uid(), name, buys: [{ amt: g().defaultBuyIn, t: now() }], cash: null };
      g().players.push(p); log(`${name} сел за стол, бай-ин ${fmt(g().defaultBuyIn)}`); save();
      const tmp = document.createElement("div"); tmp.innerHTML = playerView(p);
      $("#players").appendChild(tmp.firstElementChild);
      $("#add-name").value = ""; renderDerived(); refreshDatalist();
      toast(`${name} за столом, бай-ин отмечен`, () => { g().players = g().players.filter(x => x !== p); save(); render(); });
      return;
    }
    if (f.dataset.form === "custom") {
      const p = findP(f), v = parseNum(f.querySelector("input").value);
      if (!v || v <= 0) { toast("Введите сумму больше нуля"); return; }
      addBuy(p, v); save(); replacePlayer(p); renderDerived(); toast(`${p.name}: заход ${fmt(v)}`); return;
    }
    if (f.id === "setup-form") {
      const buyIn = parseNum($("#new-buyin").value), rate = parseNum($("#new-rate").value);
      if (!buyIn || buyIn <= 0) { toast("Укажите бай-ин больше нуля"); $("#new-buyin").focus(); return; }
      const names = currentNames().map((v, i) => v.trim() || `Игрок ${i + 1}`);
      const seen = new Set(), dup = names.find(n => seen.has(keyOf(n)) || !seen.add(keyOf(n)));
      if (dup) { toast(`Имя «${dup}» встречается дважды`); return; }
      const auto = $("#new-autobuy").checked;
      if (g() && !g().example && g().players.some(p => p.buys.length)) archive(g());
      const t = now(), currency = $("#new-cur").value.trim() || "₽";
      state.game = {
        id: uid(), title: $("#new-title").value.trim() || `Игра ${ddmm(t)}`, started: t, currency, defaultBuyIn: buyIn,
        chipRate: rate && rate > 0 ? rate : 1, mode: "direct", bankerId: null, example: false, log: [],
        players: names.map(name => ({ id: uid(), name, buys: auto ? [{ amt: buyIn, t }] : [], cash: null }))
      };
      log(`Игра началась: ${names.length} ${plural(names.length, "игрок", "игрока", "игроков")}, бай-ин ${fmt(buyIn)}`);
      state.lastPlayers = names.filter(n => !AUTO_NAME.test(n));
      state.setup = false; save(); render(); window.scrollTo(0, 0); keepAwake();
    }
  });

  document.addEventListener("keydown", e => {
    const el = e.target;
    if (e.key !== "Enter" || !el.matches("[data-name]")) return;
    e.preventDefault();
    const next = $("#new-name-" + (+el.id.slice(9) + 1));
    if (next) next.focus(); else el.blur();
  });

  document.addEventListener("input", e => {
    const el = e.target;
    if (el.id === "new-count") { const n = parseInt(el.value, 10); if (n > 0) { const keep = el.value; setCount(n); el.value = keep; } return; }
    if (el.matches("[data-name]")) { syncSuggest(); return; }
    if (el.matches("[data-cash]")) {
      const p = findP(el), v = el.value.trim();
      p.cash = v === "" ? null : parseNum(v);
      if (p.cash != null && p.cash < 0) p.cash = 0;
      save(); renderDerived();
    }
  });

  document.addEventListener("change", e => {
    const el = e.target, game = g();
    if (el.id === "new-count") { setCount(parseInt(el.value, 10)); return; }
    if (el.id === "import-file") {
      const file = el.files && el.files[0]; if (!file) return;
      const r = new FileReader(); r.onload = () => importBackup(String(r.result)); r.readAsText(file); return;
    }
    if (!game) return;
    if (el.matches("[data-cash]")) { const p = findP(el); if (p.cash != null) { log(`${p.name}: стек ${p.cash.toLocaleString("ru-RU")}${game.chipRate !== 1 ? " фишек" : " " + game.currency}`); save(); } }
    else if (el.classList.contains("p-name")) {
      const p = findP(el), n = el.value.trim();
      if (!n || game.players.some(x => x !== p && keyOf(x.name) === keyOf(n))) { el.value = p.name; if (n) toast(`${n} уже за столом`); return; }
      log(`${p.name} → ${n}`); p.name = n; save(); renderDerived(); refreshDatalist();
    }
    else if (el.id === "banker") { game.bankerId = el.value; save(); renderDerived(); }
    else if (el.id === "set-buyin") { const v = parseNum(el.value); if (v > 0) { game.defaultBuyIn = v; log(`Бай-ин: ${fmt(v)}`); save(); reopenSettings(); } }
    else if (el.id === "set-cur") { game.currency = el.value.trim() || "₽"; save(); reopenSettings(); }
    else if (el.id === "set-rate") { const v = parseNum(el.value); if (v > 0) { game.chipRate = v; save(); reopenSettings(); } }
    else if (el.id === "set-title") { game.title = el.value.trim() || game.title; save(); reopenSettings(); }
  });
  function reopenSettings() { render(); $("#settings").hidden = false; }

  render();
})();
</script>
</body>
</html>
